services:
  postgres:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-homeeasy}
      POSTGRES_USER: ${DATABASE_USER:-homeeasy}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-homeeasy-local}
    ports:
      - "${DATABASE_PORT:-5435}:5432"
    volumes:
      - homeeasyPostgresData:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-homeeasy}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-homeeasy-local-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - homeeasyMinioData:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  homeeasyPostgresData:
  homeeasyMinioData:
