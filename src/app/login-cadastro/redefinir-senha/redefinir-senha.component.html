<app-navbar [authenticated]="false"></app-navbar>
<main class="app-page">
  <div class="page-shell page-shell-narrow">
    <header class="page-heading">
      <div class="page-heading-copy">
        <span class="page-kicker">Segurança</span>
        <h1>Crie uma nova senha.</h1>
        <p>Use uma senha forte, exclusiva e com pelo menos oito caracteres.</p>
      </div>
    </header>

    <form class="surface-card form-stack" #passwordForm="ngForm" (ngSubmit)="resetPassword()">
      <div class="field-group">
        <label for="newPassword">Nova senha</label>
        <input id="newPassword" type="password" name="password" [(ngModel)]="password" required minlength="8" autocomplete="new-password" #passwordInput="ngModel">
        <span class="field-error" *ngIf="passwordInput.invalid && passwordInput.touched">Use pelo menos oito caracteres.</span>
      </div>
      <div class="field-group">
        <label for="passwordConfirmation">Confirme a nova senha</label>
        <input id="passwordConfirmation" type="password" name="passwordConfirmation" [(ngModel)]="passwordConfirmation" required minlength="8" autocomplete="new-password">
      </div>
      <app-action-feedback [message]="feedbackMessage" [type]="feedbackType"></app-action-feedback>
      <div class="form-actions">
        <button class="button-primary" type="submit" *ngIf="!passwordChanged" [disabled]="!passwordForm.valid || !token || isSubmitting">{{ isSubmitting ? 'Atualizando...' : 'Atualizar senha' }}</button>
        <button class="button-primary" type="button" *ngIf="passwordChanged" (click)="goToLogin()">Entrar</button>
        <a class="button-secondary" *ngIf="!passwordChanged" routerLink="/recuperar-senha">Solicitar outro link</a>
      </div>
    </form>
  </div>
</main>
