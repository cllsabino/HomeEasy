<app-navbar [authenticated]="entrarSair" [userId]="userId" (logout)="sair()"></app-navbar>
<main class="app-page"><div class="page-shell page-shell-narrow"><header class="page-heading"><div class="page-heading-copy"><span class="page-kicker">Meus serviços</span><h1>Editar {{ servico.nome }}.</h1><p>Mantenha valor e descrição atualizados para seus clientes.</p></div></header>
  <form class="surface-card form-stack" #f="ngForm"><div class="field-group"><label for="servicePrice">Valor do serviço</label><input id="servicePrice" type="number" name="preco" [(ngModel)]="servicoped.preco" required pattern="[0-9]+([\.,][0-9]+)?" #rateInput2="ngModel"><span class="field-error" *ngIf="rateInput2.errors && rateInput2.touched">Informe um valor válido.</span></div><div class="field-group"><label for="serviceDescription">Descrição</label><textarea id="serviceDescription" name="detalhe" rows="5" [(ngModel)]="servicoped.detalhe" required></textarea></div><div class="form-grid"><div class="field-group"><label for="serviceRadius">Raio de atendimento</label><input id="serviceRadius" name="serviceRadius" type="number" min="1" max="100" [(ngModel)]="servicoped.serviceRadiusKm" required></div><div class="field-group"><label for="availableStartTime">Atende a partir de</label><input id="availableStartTime" name="availableStartTime" type="time" [(ngModel)]="servicoped.availableStartTime" required></div><div class="field-group"><label for="availableEndTime">Atende até</label><input id="availableEndTime" name="availableEndTime" type="time" [(ngModel)]="servicoped.availableEndTime" required></div></div><fieldset class="schedule-options"><legend>Dias disponíveis</legend><label *ngFor="let weekday of weekdays"><input type="checkbox" [name]="'weekday-' + weekday.value" [checked]="isWeekdayAvailable(weekday.value)" #weekdayInput (change)="toggleWeekday(weekday.value, weekdayInput.checked)"> {{ weekday.label }}</label></fieldset><div class="form-actions"><button class="button-primary" type="button" [disabled]="!f.valid || !servicoped.availableWeekdays || !servicoped.availableWeekdays.length || isSubmitting" (click)="editarInfo()">{{ isSubmitting ? 'Salvando...' : 'Salvar alterações' }}</button><a class="button-secondary" [routerLink]="['/serviços', userId]">Cancelar</a></div></form>
</div></main>
